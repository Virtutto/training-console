/* ============================================================
   PER-EXERCISE OVERRIDES (persist forever until edited/reset)
   ============================================================ */
function overrideKey(day, section, idx){ return day + "|" + section + "|" + idx; }
function getEffective(day, section, idx) {
  var base;
  if (section === "WARMUP") base = PLAN[day].warmup[idx];
  else if (section === "COOLDOWN") base = PLAN[day].cooldown[idx];
  else base = PLAN[day].main[idx];
  var ov = state.overrides[overrideKey(day, section, idx)];
  if (!ov) return base;
  return Object.assign({}, base, ov);
}

function buildQueue(day) {
  var plan = PLAN[day];
  if (!plan || plan.mode !== "session") return [];
  var queue = [];
  function pushBlock(section, exercises) {
    exercises.forEach(function(ex, idx) {
      var eff = getEffective(day, section, idx);
      var sets = eff.sets || 1;
      for (var i = 0; i < sets; i++) {
        queue.push({
          section: section, name: eff.name, setIndex: i+1, setTotal: sets,
          type: eff.type, duration: eff.duration, repsLabel: eff.label,
          restAfter: eff.rest || 0
        });
      }
    });
  }
  pushBlock("WARMUP", plan.warmup);
  pushBlock("MAIN", plan.main);
  if (plan.cooldown && !state.cooldownSkip) pushBlock("COOLDOWN", plan.cooldown);
  return queue;
}

function buildQueueNoWarmup(day) {
  var plan = PLAN[day];
  if (!plan || plan.mode !== "session") return [];
  var queue = [];
  function pushBlock(section, exercises) {
    exercises.forEach(function(ex, idx) {
      var eff = getEffective(day, section, idx);
      var sets = eff.sets || 1;
      for (var i = 0; i < sets; i++) {
        queue.push({
          section: section, name: eff.name, setIndex: i+1, setTotal: sets,
          type: eff.type, duration: eff.duration, repsLabel: eff.label,
          restAfter: eff.rest || 0
        });
      }
    });
  }
  pushBlock("MAIN", plan.main);
  if (plan.cooldown && !state.cooldownSkip) pushBlock("COOLDOWN", plan.cooldown);
  return queue;
}

// QUICK START: one set per MAIN exercise, no warmup/cooldown.
function buildQueueQuick(day) {
  var plan = PLAN[day];
  if (!plan || plan.mode !== "session") return [];
  var queue = [];
  plan.main.forEach(function(ex, idx) {
    var eff = getEffective(day, "MAIN", idx);
    queue.push({
      section: "MAIN", name: eff.name, setIndex: 1, setTotal: 1,
      type: eff.type, duration: eff.duration, repsLabel: eff.label,
      restAfter: eff.rest || 0
    });
  });
  return queue;
}

/* ============================================================

   ============================================================ */

  var cur = state.dayCompletion[dateISO] || 0;
  state.dayCompletion[dateISO] = Math.max(cur, percent);
  Storage.set("day-completion", JSON.stringify(state.dayCompletion));

function hexToRgb(hex) {
  hex = hex.replace("#","");
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
}
function lerp(a,b,t){ return Math.round(a + (b-a)*t); }
function percentToColor(pct) {
  pct = Math.max(0, Math.min(100, pct));
  var stops = [
    [0,   "#ff3b30"],  // red
    [33,  "#ff9500"],  // orange
    [66,  "#ffd60a"],  // yellow
    [100, "#34c759"]   // green
  ];
  var lo = stops[0], hi = stops[stops.length-1];
  for (var i = 0; i < stops.length - 1; i++) {
    if (pct >= stops[i][0] && pct <= stops[i+1][0]) { lo = stops[i]; hi = stops[i+1]; break; }
  }
  var span = hi[0] - lo[0];
  var t = span > 0 ? (pct - lo[0]) / span : 0;
  var c1 = hexToRgb(lo[1]), c2 = hexToRgb(hi[1]);
  var r = lerp(c1[0], c2[0], t), g = lerp(c1[1], c2[1], t), b = lerp(c1[2], c2[2], t);
  return "rgb(" + r + "," + g + "," + b + ")";
}

/* ============================================================
   SOUND + HAPTIC (respects alert mode: both | vibrate | silent)
   ============================================================ */
var audioCtx = null;
function beep(freq, dur) {
  freq = freq || 880; dur = dur || 0.15;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = audioCtx.createOscillator(); var gain = audioCtx.createGain();
    osc.type = "sine"; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern || 200); } catch(e) {}
}
function triggerAlert(freq, dur, pattern) {
  if (state.alertMode === "both") { beep(freq, dur); vibrate(pattern); }
  else if (state.alertMode === "vibrate") { vibrate(pattern); }
  /* silent: nothing */
}

/* ============================================================
   WAKE LOCK - keeps screen on during an active session
   ============================================================ */
var wakeLock = null;
var wakeLockSupported = ("wakeLock" in navigator);
function requestWakeLock() {
  if (!wakeLockSupported) return;
  navigator.wakeLock.request("screen").then(function(lock){ wakeLock = lock; }).catch(function(){});
}
function releaseWakeLock() {
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch(e) {}
}
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible" && state && state.view === "active") requestWakeLock();
});

/* ============================================================

   Note: full install-prompt + offline caching needs HTTPS hosting for a
   service worker - file:// can't run one. This just improves the manual
   "Add to Home Screen" result even for the local file.
   ============================================================ */
(function attachManifest(){
  try {
    var iconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" fill="%2303060a"/><circle cx="96" cy="96" r="66" fill="none" stroke="%2300e5ff" stroke-width="10"/><circle cx="96" cy="96" r="34" fill="%2300e5ff"/></svg>';
    var iconURI = "data:image/svg+xml," + iconSVG;
    var manifest = {
      name: "Training Console",
      short_name: "Training",
      start_url: ".",
      display: "standalone",
      background_color: "#03060a",
      theme_color: "#03060a",
      icons: [{ src: iconURI, sizes: "192x192", type: "image/svg+xml" }]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    document.getElementById("manifestLink").href = URL.createObjectURL(blob);
  } catch(e) {}
})();

/* Service Worker Registration for offline PWA */

  navigator.serviceWorker.register("./sw.js").catch(function(){});

var timerId = null;

function saveHistory(nextArr) {
  state.history = nextArr;
  Storage.set("workout-history", JSON.stringify(nextArr));
}
function logCompletion(day, type) {
  var record = { date: localISO(new Date()), day: day, type: type, at: new Date().toISOString() };
  saveHistory(state.history.concat([record]));
}
function recordExerciseHistory(day, cutoffIdx) {
  var passed = state.queue.slice(0, cutoffIdx);
  var byName = {};
  passed.forEach(function(step){
    if (step.section !== "MAIN") return;
    if (!byName[step.name]) byName[step.name] = { count: 0, total: step.setTotal };
    byName[step.name].count++;
  });
  var date = localISO(new Date());
  var entries = state.exerciseHistory.slice();
  Object.keys(byName).forEach(function(name){
    entries.push({ date: date, day: day, exercise: name, setsCompleted: byName[name].count, setsTotal: byName[name].total });
  });
  state.exerciseHistory = entries;
  Storage.set("exercise-history", JSON.stringify(entries));
}
function lastExerciseRecord(name) {
  var recs = state.exerciseHistory.filter(function(r){ return r.exercise === name; });
  if (!recs.length) return null;
  recs.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  return recs[0];
}
function lastSetLog(name) {
  var recs = state.setLogs.filter(function(r){ return r.exercise === name; });
  if (!recs.length) return null;
  return recs[recs.length - 1];
}

function setLogsForDate(iso) {
  return state.setLogs.filter(function(e){ return e.date === iso; });
}
function boulderLogsForDate(iso) {
  return state.history.filter(function(r){ return r.date === iso && r.type === "boulder"; });
}

/* ============================================================
   SESSION ENGINE
   ============================================================ */
function beginSession(queue) {
  if (!queue || queue.length === 0) return;
  state.queue = queue; state.stepIdx = 0; state.phase = "windup"; state.paused = false;
  state.sessionLog = [];
  state.sessionStartTime = Date.now();
  startTimedPhase(WINDUP_SECONDS);
  state.view = "active";
  requestWakeLock();
  render();
  runTimer();
}
function startSession() {
  var q = state.warmupSkip ? buildQueueNoWarmup(state.selectedDay) : buildQueue(state.selectedDay);
  beginSession(q);
}
function startQuickSession() {
  beginSession(buildQueueQuick(state.selectedDay));
}
function toggleWarmupSkip() {
  state.warmupSkip = !state.warmupSkip;
  Storage.set("warmup-skip", JSON.stringify(state.warmupSkip));
  render();
}
function toggleCooldownSkip() {
  state.cooldownSkip = !state.cooldownSkip;
  Storage.set("cooldown-skip", JSON.stringify(state.cooldownSkip));
  render();
}

/* ============================================================
   PR TRACKER
   ============================================================ */
function getPR(exerciseName) {
  return state.personalRecords[exerciseName] || null;
}
function checkForPR(exerciseName, actualReps, difficulty) {
  var prev = state.personalRecords[exerciseName];
  var isPR = false;
  var prType = "";
  if (!prev) {
    /* First time - any completion is a PR */
    isPR = true;
    prType = "FIRST LOG";
  } else if (actualReps != null && prev.bestReps != null && actualReps > prev.bestReps) {
    isPR = true;
    prType = "REPS: " + prev.bestReps + " -> " + actualReps;
  } else if (difficulty === "easy" && prev.lastDifficulty !== "easy") {
    isPR = true;
    prType = "MASTERY: " + (prev.lastDifficulty || "unknown") + " -> EASY";
  }
  if (isPR) {
    state.personalRecords[exerciseName] = {
      bestReps: actualReps != null ? actualReps : (prev ? prev.bestReps : null),
      lastDifficulty: difficulty,
      date: todayISO,
      streak: prev && prev.date === getPrevTrainingDate(todayISO) ? (prev.streak || 0) + 1 : 1
    };
    Storage.set("personal-records", JSON.stringify(state.personalRecords));
    state.lastPR = { exercise: exerciseName, type: prType, date: todayISO };
  } else {
    state.lastPR = null;
  }
  return isPR;
}
function getPrevTrainingDate(iso) {
  /* Simple: yesterday or two days ago (skip rest days) */
  var d = new Date(iso + "T00:00:00");
  for (var i = 1; i <= 3; i++) {
    d.setDate(d.getDate() - 1);
    var dow = d.getDay();
    if (dow !== 0 && dow !== 3) return localISO(d);
  }
  return null;
}

/* ============================================================
   ADAPTIVE REST
   ============================================================ */
function calculateAdaptiveRest(baseRest, difficulty, exerciseName) {
  if (!baseRest || baseRest <= 0) return baseRest;
  var adj = state.restAdjustments[exerciseName] || 0;
  if (difficulty === "easy") adj -= 15;
  else if (difficulty === "hard") adj += 15;
  else if (difficulty === "failed") adj += 30;
  /* Clamp: rest can't go below 15s or above base+60s */
  adj = Math.max(adj, -(baseRest - 15));
  adj = Math.min(adj, 60);
  state.restAdjustments[exerciseName] = adj;
  Storage.set("rest-adjustments", JSON.stringify(state.restAdjustments));
  return Math.max(15, baseRest + adj);
}
function getRestAdjLabel(exerciseName) {
  var adj = state.restAdjustments[exerciseName] || 0;
  if (adj === 0) return "";
  return (adj > 0 ? "+" : "") + adj + "s";
}
function toggleBoulder() {
  if (state.boulderLoggedToday) {
    saveHistory(state.history.filter(function(r){ return !(r.date === todayISO && r.type === "boulder"); }));
    state.boulderLoggedToday = false;
  } else {
    logCompletion(state.selectedDay, "boulder");
    state.boulderLoggedToday = true;
  }
  render();
}
function currentStep() { return state.queue[state.stepIdx]; }
function sessionProgressPercent() {
  if (!state.queue.length) return 0;
  return Math.round((state.stepIdx / state.queue.length) * 100);
}

function startTimedPhase(seconds) {
  state.secondsLeft = seconds;
  state.phaseEndTime = Date.now() + seconds * 1000;
}
function runTimer() {
  clearTimeout(timerId);
  if (state.view !== "active" || state.paused || state.phase === "awaitingFinish" || state.phase === "logSet") return;
  /* Drift correction: recompute remaining from absolute wall-clock time */
  if (state.phaseEndTime) {
    var remaining = Math.ceil((state.phaseEndTime - Date.now()) / 1000);
    if (remaining !== state.secondsLeft) {
      state.secondsLeft = Math.max(0, remaining);
      render();
    }
  }
  /* Audio beeps: progressive beeps at 25/50/75% during timed work holds */
  if (state.phase === "work" && state.phaseEndTime) {
    var cur = currentStep();
    if (cur && cur.type === "time" && cur.duration > 0) {
      var elapsed = cur.duration - state.secondsLeft;
      var pct = Math.floor((elapsed / cur.duration) * 100);
      [25, 50, 75].forEach(function(threshold) {
        if (pct >= threshold && !state.beepFired[threshold]) {
          state.beepFired[threshold] = true;
          triggerAlert(440 + (threshold * 4), 0.12, 80);
        }
      });
    }
  }
  if (state.secondsLeft <= 0) { advancePhase(); return; }
  timerId = setTimeout(runTimer, 250);
}
function recordSetLog(difficulty) {
  var cur = currentStep();
  if (!cur) return;
  var actualReps = null;
  var actualDuration = null;
  if (cur.type === "reps") {
    var input = document.getElementById("actualRepsInput");
    var v = input ? parseInt(input.value, 10) : NaN;
    actualReps = isNaN(v) ? null : v;
  } else if (cur.type === "time") {
    var input = document.getElementById("actualDurationInput");
    var v = input ? parseInt(input.value, 10) : NaN;
    actualDuration = isNaN(v) ? cur.duration : Math.min(v, cur.duration);
  }
  var entry = {
    date: localISO(new Date()), day: state.selectedDay,
    exercise: cur.name, section: cur.section, setIndex: cur.setIndex, setTotal: cur.setTotal,
    type: cur.type, target: cur.type === "time" ? cur.duration : cur.repsLabel,
    actualReps: actualReps, actualDuration: actualDuration, difficulty: difficulty
  };
  state.setLogs = state.setLogs.concat([entry]);
  Storage.set("set-log", JSON.stringify(state.setLogs));
  state.sessionLog.push(entry);
  checkForPR(cur.name, actualReps, difficulty);
  computeSuggestion(cur, difficulty, actualReps, actualDuration);
  goToRestOrNext();
}
function computeSuggestion(cur, difficulty, actualReps, actualDuration) {
  var exName = cur.name;
  var prev = state.exerciseSuggestions[exName] || {};
  var suggestion = { lastDifficulty: difficulty, date: todayISO };
  if (cur.type === "reps") {
    var baseReps = prev.suggestedReps || parseRepsLabel(cur.repsLabel);
    if (difficulty === "easy") {
      suggestion.suggestedReps = Math.max(1, baseReps + 2);
    } else if (difficulty === "failed") {
      suggestion.suggestedReps = Math.max(1, baseReps - 2);
    } else {
      suggestion.suggestedReps = baseReps;
    }
  } else if (cur.type === "time") {
    var baseDur = prev.suggestedDuration || cur.duration;
    if (difficulty === "easy") {
      suggestion.suggestedDuration = Math.max(5, baseDur + 5);
    } else if (difficulty === "failed") {
      suggestion.suggestedDuration = Math.max(5, baseDur - 5);
    } else {
      suggestion.suggestedDuration = baseDur;
    }
  }
  state.exerciseSuggestions[exName] = suggestion;
  Storage.set("exercise-suggestions", JSON.stringify(state.exerciseSuggestions));
}
function parseRepsLabel(label) {
  if (!label) return 8;
  if (label === "MAX") return 10;
  var m = label.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 8;
}
function advancePhase() {
  var cur = currentStep();
  if (!cur) return;
  if (state.phase === "windup") {
    triggerAlert(1046,0.2,150);
    state.beepFired = {};
    if (cur.type === "time") { state.phase = "work"; startTimedPhase(cur.duration); }
    else { state.phase = "awaitingFinish"; state.phaseEndTime = null; }
    render(); runTimer();
    return;
  }
  if (state.phase === "work") { triggerAlert(660,0.25,[150,80,150]); state.phase = "logSet"; state.phaseEndTime = null; render(); return; }
  if (state.phase === "rest") { triggerAlert(1046,0.2,100); goToNextStep(); return; }
}
function finishReps() { triggerAlert(660,0.25,[150,80,150]); state.phase = "logSet"; render(); }
function goToRestOrNext() {
  var cur = currentStep();
  var baseRest = cur.restAfter || 0;
  var rest = calculateAdaptiveRest(baseRest, state.sessionLog[state.sessionLog.length-1].difficulty, cur.name);
  var isLast = state.stepIdx >= state.queue.length - 1;
  if (rest > 0 && !isLast) { state.phase = "rest"; startTimedPhase(rest); render(); runTimer(); }
  else { goToNextStep(); }
}
function goToNextStep() {
  if (state.stepIdx >= state.queue.length - 1) {
    logCompletion(state.selectedDay, "workout");
    recordExerciseHistory(state.selectedDay, state.queue.length);
    recordDayCompletion(localISO(new Date()), 100);
    releaseWakeLock();
    state.view = "complete";
    Storage.set("active-session", "");
    render();
    return;
  }
  state.stepIdx += 1; state.phase = "windup";
  startTimedPhase(WINDUP_SECONDS);
  render(); runTimer();
}
function skipPhase() { state.secondsLeft = 0; state.phaseEndTime = null; render(); runTimer(); }
function togglePause() {
  state.paused = !state.paused;
  if (!state.paused && state.phaseEndTime && state.secondsLeft > 0) {
    state.phaseEndTime = Date.now() + state.secondsLeft * 1000;
  }
  render(); runTimer();
}
function exitSession() {
  clearTimeout(timerId);
  var percent = sessionProgressPercent();
  if (state.queue.length > 0) {
    recordDayCompletion(localISO(new Date()), percent);
    if (percent >= 75) {
      logCompletion(state.selectedDay, "workout");
      recordExerciseHistory(state.selectedDay, state.stepIdx);
    }
  }
  releaseWakeLock();
  state.view = "overview";
  Storage.set("active-session", "");
  render();
}
function returnFromComplete() { state.view = "overview"; Storage.set("active-session", ""); render(); }

/* ============================================================
   SESSION PERSISTENCE (survives tab close / browser restart)
   ============================================================ */
function saveSessionState() {
  if (state.view !== "active") {
    try { Storage.set("active-session", ""); } catch(e) {}
    return;
  }
  var data = {
    queue: state.queue,
    stepIdx: state.stepIdx,
    phase: state.phase,
    phaseEndTime: state.phaseEndTime,
    secondsLeft: state.secondsLeft,
    paused: state.paused,
    selectedDay: state.selectedDay,
    date: todayISO,
    sessionLog: state.sessionLog || [],
    sessionStartTime: state.sessionStartTime
  };
  try { Storage.set("active-session", JSON.stringify(data)); } catch(e) {}
}
function restoreSession() {
  var raw;
  try { raw = Storage.get("active-session"); } catch(e) { return false; }
  if (!raw) return false;
  try {
    var data = JSON.parse(raw);
    if (!data.queue || data.stepIdx == null || !data.phase) return false;
    /* Only restore sessions started today - stale ones get discarded */
    if (data.date !== todayISO) { Storage.set("active-session", ""); return false; }
    state.queue = data.queue;
    state.stepIdx = data.stepIdx;
    state.phase = data.phase;
    state.paused = data.paused || false;
    state.selectedDay = data.selectedDay;
    state.view = "active";
    state.sessionLog = data.sessionLog || [];
    state.sessionStartTime = data.sessionStartTime || null;
    if (!data.paused && data.phaseEndTime) {
      var remaining = Math.ceil((data.phaseEndTime - Date.now()) / 1000);
      state.secondsLeft = Math.max(0, remaining);
      state.phaseEndTime = data.phaseEndTime;
    } else {
      state.secondsLeft = data.secondsLeft || WINDUP_SECONDS;
      state.phaseEndTime = null;
    }
    requestWakeLock();
    return true;
  } catch(e) { return false; }
}

function openNoteModal(name) { state.noteModal = { name: name, value: state.notes[name] || "" }; render(); }
function closeNoteModal() { state.noteModal = null; render(); }
function saveNoteModal() {
  var m = state.noteModal; if (!m) return;
  var val = document.getElementById("noteInput").value.trim();
  if (val) { state.notes[m.name] = val; }
  else { delete state.notes[m.name]; }
  Storage.set("exercise-notes", JSON.stringify(state.notes));
  state.noteModal = null;
  render();
}
function renderNoteModal() {

function openEditModal(day, section, idx) { state.editModal = { day: day, section: section, idx: idx }; render(); }
function closeEditModal() { state.editModal = null; render(); }
function saveEditModal() {
  var m = state.editModal; if (!m) return;
  var eff = getEffective(m.day, m.section, m.idx);
  var setsVal = parseInt(document.getElementById("editSetsInput").value, 10);
  var restVal = parseInt(document.getElementById("editRestInput").value, 10);
  var patch = {};
  patch.sets = isNaN(setsVal) || setsVal < 1 ? eff.sets : setsVal;
  patch.rest = isNaN(restVal) || restVal < 0 ? eff.rest : restVal;
  if (eff.type === "time") {
    var durVal = parseInt(document.getElementById("editValueInput").value, 10);
    patch.duration = isNaN(durVal) || durVal < 1 ? eff.duration : durVal;
  } else {
    var labelVal = document.getElementById("editValueInput").value.trim();
    patch.label = labelVal || eff.label;
  }
  var key = overrideKey(m.day, m.section, m.idx);
  state.overrides[key] = Object.assign({}, state.overrides[key] || {}, patch);
  Storage.set("exercise-overrides", JSON.stringify(state.overrides));
  state.editModal = null;
  render();
}
function resetEditModal() {
  var m = state.editModal; if (!m) return;
  var key = overrideKey(m.day, m.section, m.idx);
  delete state.overrides[key];
  Storage.set("exercise-overrides", JSON.stringify(state.overrides));
  state.editModal = null;
  render();
}

   EXPORT / IMPORT
   ============================================================ */
function exportData() {
  var payload = JSON.stringify({
    history: state.history,
    exerciseHistory: state.exerciseHistory,
    setLogs: state.setLogs,
    dayCompletion: state.dayCompletion,
    overrides: state.overrides,
    alertMode: state.alertMode,
    themeKey: state.themeKey,
    notes: state.notes,
    warmupSkip: state.warmupSkip,
    personalRecords: state.personalRecords,
    restAdjustments: state.restAdjustments,
    cooldownSkip: state.cooldownSkip,
    measurements: state.measurements,
    exerciseSuggestions: state.exerciseSuggestions,
    exportedAt: new Date().toISOString()
  }, null, 2);
  var blob = new Blob([payload], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "training-console-backup-" + todayISO + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImport() { document.getElementById("importFileInput").click(); }
function handleImportFile(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(evt) {
    try {
      var data = JSON.parse(evt.target.result);
      if (Array.isArray(data.history)) saveHistory(data.history);
      if (Array.isArray(data.exerciseHistory)) { state.exerciseHistory = data.exerciseHistory; Storage.set("exercise-history", JSON.stringify(data.exerciseHistory)); }
      if (Array.isArray(data.setLogs)) { state.setLogs = data.setLogs; Storage.set("set-log", JSON.stringify(data.setLogs)); }
      if (data.dayCompletion) { state.dayCompletion = data.dayCompletion; Storage.set("day-completion", JSON.stringify(data.dayCompletion)); }
      if (data.overrides) { state.overrides = data.overrides; Storage.set("exercise-overrides", JSON.stringify(data.overrides)); }
      if (data.alertMode) { state.alertMode = data.alertMode; Storage.set("alert-mode", data.alertMode); }
      if (data.themeKey && THEMES[data.themeKey]) { state.themeKey = data.themeKey; Storage.set("theme-key", data.themeKey); }
      if (data.notes) { state.notes = data.notes; Storage.set("exercise-notes", JSON.stringify(data.notes)); }
      if (data.warmupSkip != null) { state.warmupSkip = !!data.warmupSkip; Storage.set("warmup-skip", JSON.stringify(state.warmupSkip)); }
      if (data.personalRecords) { state.personalRecords = data.personalRecords; Storage.set("personal-records", JSON.stringify(data.personalRecords)); }
      if (data.restAdjustments) { state.restAdjustments = data.restAdjustments; Storage.set("rest-adjustments", JSON.stringify(data.restAdjustments)); }
      if (data.cooldownSkip != null) { state.cooldownSkip = !!data.cooldownSkip; Storage.set("cooldown-skip", JSON.stringify(state.cooldownSkip)); }
      if (Array.isArray(data.measurements)) { state.measurements = data.measurements; Storage.set("body-measurements", JSON.stringify(data.measurements)); }
      if (data.exerciseSuggestions) { state.exerciseSuggestions = data.exerciseSuggestions; Storage.set("exercise-suggestions", JSON.stringify(data.exerciseSuggestions)); }
      state.boulderLoggedToday = state.history.some(function(r){ return r.date === todayISO && r.type === "boulder"; });
      render();
      alert("Import complete.");
    } catch (err) {
      alert("Import failed - file was not valid backup JSON.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

/* ============================================================
   STATS
   ============================================================ */
function computeStats() {
  var last7 = [];
  for (var i = 6; i >= 0; i--) {
    var d = new Date(); d.setDate(d.getDate() - i);
    var iso = localISO(d);
    var dName = DAY_ORDER[d.getDay()];
    var isRestDay = PLAN[dName].mode === "rest";
    var hasLog = state.history.some(function(r){ return r.date === iso; });
    last7.push({ iso: iso, active: hasLog || isRestDay, isRestDay: isRestDay });
  }
  var last30 = [];
  for (var k = 29; k >= 0; k--) {
    var d2 = new Date(); d2.setDate(d2.getDate() - k);
    var iso2 = localISO(d2);
    var dName2 = DAY_ORDER[d2.getDay()];
    var mode2 = PLAN[dName2].mode;
    var isRestDay2 = mode2 === "rest";
    var pct2;
    if (mode2 === "boulder") {
      pct2 = state.history.some(function(r){ return r.date === iso2 && r.type === "boulder"; }) ? 100 : 0;
    } else if (mode2 === "rest") {
      pct2 = 100;
    } else {
      pct2 = state.dayCompletion[iso2] || 0;
    }
    last30.push({ iso: iso2, isRestDay: isRestDay2, percent: pct2 });
  }
  var totalSessions = state.history.filter(function(r){ return r.type === "workout"; }).length;
  var totalBoulder = state.history.filter(function(r){ return r.type === "boulder"; }).length;
  var thisWeekCount = last7.filter(function(d){ return d.active && !d.isRestDay; }).length;
  var streak = 0;
  for (var j = last7.length - 1; j >= 0; j--) { if (last7[j].active) streak++; else break; }
  return { last7: last7, last30: last30, totalSessions: totalSessions, totalBoulder: totalBoulder, thisWeekCount: thisWeekCount, streak: streak };
}

function theme() { return THEMES[state.themeKey]; }

function ringSVG(progress, colorAccent, glow, size, stroke, innerHTML) {
  size = size || 240; stroke = stroke || 10;
  var r = (size - stroke) / 2;
  var c = 2 * Math.PI * r;
  var offset = c * (1 - progress);
  var ticks = "";
  for (var i = 0; i < 60; i++) {
    var angle = (i/60) * 360;
    var major = i % 5 === 0;
    var rad = angle * Math.PI / 180;
    var x1 = size/2 + (r+stroke/2+2)*Math.cos(rad), y1 = size/2 + (r+stroke/2+2)*Math.sin(rad);
    var x2 = size/2 + (r+stroke/2+(major?8:4))*Math.cos(rad), y2 = size/2 + (r+stroke/2+(major?8:4))*Math.sin(rad);
    ticks += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+colorAccent+'" stroke-width="'+(major?2:1)+'" opacity="0.5"/>';
  }
  return '<div style="position:relative;width:'+size+'px;height:'+size+'px;margin:0 auto;">'+
    '<svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg)">'+
      '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="'+stroke+'"/>'+
      ticks+
      '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+colorAccent+'" stroke-width="'+stroke+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" stroke-linecap="round" style="filter:drop-shadow(0 0 8px '+glow+');transition:stroke-dashoffset 1s linear"/>'+
    '</svg>'+
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;">'+innerHTML+'</div>'+
  '</div>';
}

      '<div style="margin-bottom:18px;"><label class="fieldlabel">REST (SECONDS)</label><input type="number" id="editRestInput" value="'+(eff.rest||0)+'" min="0" /></div>'+
      '<div style="display:flex;gap:10px;">'+
        '<button class="ctrlbtn" onclick="closeEditModal()">CANCEL</button>'+
        (isOv ? '<button class="ctrlbtn" onclick="resetEditModal()" style="color:#ff7b86;">RESET</button>' : '')+
        '<button class="ctrlbtn" onclick="saveEditModal()" style="background:'+t.accent+';color:#02080a;">SAVE</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function renderActive() {
  var t = theme();
  var cur = currentStep();
  if (!cur) return '';
  var total = state.queue.length;
  var label = state.phase==="windup" ? "GET READY" : state.phase==="work" ? (cur.type==="time"?"HOLD / GO":"WORKING") : state.phase==="rest" ? "REST" : "YOUR CALL";
  var ringMax = state.phase==="windup" ? WINDUP_SECONDS : state.phase==="work" ? cur.duration : state.phase==="rest" ? cur.restAfter : 1;
  var progress = (state.phase==="awaitingFinish" || state.phase==="logSet") ? 1 : (ringMax>0 ? 1-(state.secondsLeft/ringMax) : 1);
  progress = Math.min(Math.max(progress,0),1);
  var ringAccent = state.phase==="rest" ? "#7fd88a" : t.accent;
  var ringGlow = state.phase==="rest" ? "rgba(127,216,138,0.35)" : t.glow;

  var inner;
  if (state.phase === "awaitingFinish") {
    inner = '<div class="dim" style="font-size:12px;margin-bottom:6px;letter-spacing:1px;">'+cur.repsLabel+'</div>'+
      '<div class="hdr" style="font-size:14px;color:'+t.accent+';">TAP FINISH</div>';
  } else if (state.phase === "logSet") {
    inner = '<div class="dim" style="font-size:11px;letter-spacing:1px;">LOG THIS SET</div>';
  } else {
    inner = '<div class="hdr" style="font-size:56px;color:'+ringAccent+';text-shadow:0 0 20px '+ringGlow+';">'+state.secondsLeft+'</div>'+
      '<div class="dim" style="font-size:10px;letter-spacing:2px;margin-top:4px;">'+label+'</div>';
  }

  var html = '<div class="wrap" style="display:flex;flex-direction:column;align-items:center;">';
  var percent = sessionProgressPercent();
  html += '<div class="row" style="width:100%;margin-bottom:6px;"><span class="dim" style="font-size:10px;letter-spacing:1px;">'+cur.section+' - STEP '+(state.stepIdx+1)+'/'+total+'</span>'+
    '<button onclick="exitSession()" style="color:'+TEXT_DIM+';">'+icoX(TEXT_DIM)+'</button></div>';
  html += '<div class="row" style="width:100%;margin-bottom:14px;"><span class="dim" style="font-size:10px;letter-spacing:1px;">SESSION PROGRESS</span>'+
    '<span class="hdr" style="font-size:13px;color:'+t.accent+';">'+percent+'%</span></div>';
  html += '<div class="panel" style="width:100%;text-align:center;margin-bottom:20px;">'+
    '<div class="hdr" style="font-size:17px;color:#dff3fb;">'+cur.name+'</div>'+
    '<div style="font-size:11px;color:'+t.accent+';margin-top:4px;">SET '+cur.setIndex+' / '+cur.setTotal+'</div></div>';
  html += ringSVG(progress, ringAccent, ringGlow, 240, 10, inner);

  /* Feature 2: Next-up preview during rest */
  if (state.phase === "rest" && state.stepIdx + 1 < total) {
    var next = state.queue[state.stepIdx + 1];
    html += '<div class="panel" style="width:100%;margin-top:16px;border-left:3px solid '+t.accent+';">'+
      '<div class="dim" style="font-size:9px;letter-spacing:2px;margin-bottom:4px;">UP NEXT</div>'+
      '<div style="font-size:14px;color:#dff3fb;">'+next.name+'</div>'+
      '<div style="font-size:11px;color:'+t.accent+';margin-top:2px;">SET '+(next.setIndex)+' / '+next.setTotal+' - '+(next.type==="time"?next.duration+"s":next.repsLabel)+'</div>'+
    '</div>';
  }

  /* PR badge - show after recording a set */
  if (state.lastPR && state.lastPR.exercise === cur.name) {
    html += '<div class="panel" style="width:100%;margin-top:16px;border-left:3px solid #ffd60a;background:rgba(255,214,10,0.08);">'+
      '<div style="font-size:11px;color:#ffd60a;letter-spacing:1px;">'+icoFlame("#ffd60a",14)+' PERSONAL RECORD</div>'+
      '<div style="font-size:13px;color:#dff3fb;margin-top:4px;">'+state.lastPR.type+'</div>'+
    '</div>';
  }

  /* Hybrid progression suggestion */
  var sug = state.exerciseSuggestions[cur.name];
  if (sug && sug.date !== todayISO) {
    if (cur.type === "reps" && sug.suggestedReps) {
      var diff = sug.suggestedReps - parseRepsLabel(cur.repsLabel);
      var sugColor = diff > 0 ? "#39ff88" : diff < 0 ? "#ff7b86" : t.accent;
      var sugIcon = diff > 0 ? "INCREASE" : diff < 0 ? "REGRESS" : "HOLD";
      html += '<div style="margin-top:10px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);">'+
        '<div style="font-size:9px;letter-spacing:1px;color:'+TEXT_DIM+';">SUGGESTED NEXT</div>'+
        '<div style="font-size:14px;color:'+sugColor+';font-weight:bold;margin-top:2px;">'+sug.suggestedReps+' reps <span style="font-size:9px;letter-spacing:1px;opacity:0.7;">('+sugIcon+')</span></div>'+
      '</div>';
    } else if (cur.type === "time" && sug.suggestedDuration) {
      var diff = sug.suggestedDuration - cur.duration;
      var sugColor = diff > 0 ? "#39ff88" : diff < 0 ? "#ff7b86" : t.accent;
      var sugIcon = diff > 0 ? "INCREASE" : diff < 0 ? "REGRESS" : "HOLD";
      html += '<div style="margin-top:10px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);">'+
        '<div style="font-size:9px;letter-spacing:1px;color:'+TEXT_DIM+';">SUGGESTED NEXT</div>'+
        '<div style="font-size:14px;color:'+sugColor+';font-weight:bold;margin-top:2px;">'+sug.suggestedDuration+'s <span style="font-size:9px;letter-spacing:1px;opacity:0.7;">('+sugIcon+')</span></div>'+
      '</div>';
    }
  }

  /* Adaptive rest label during rest phase */
  if (state.phase === "rest") {
    var adjLabel = getRestAdjLabel(cur.name);
    if (adjLabel) {
      var adjColor = adjLabel.startsWith("+") ? "#ff9500" : "#7fd88a";
      html += '<div style="margin-top:10px;font-size:10px;letter-spacing:1px;color:'+adjColor+';">ADJUSTED REST: '+adjLabel+'</div>';
    }
  }

  /* Feature 3: Previous set recall on logSet */
  if (state.phase === "logSet") {
    var prev = lastSetLog(cur.name);
    if (prev) {
      var diffColor = prev.difficulty==="easy"?"#7fd88a":prev.difficulty==="hard"?"#ffd60a":"#ff7b86";
      html += '<div class="panel" style="width:100%;margin-top:16px;border-left:3px solid '+diffColor+';">'+
        '<div class="dim" style="font-size:9px;letter-spacing:2px;margin-bottom:4px;">LAST SET . '+prev.date+'</div>'+
        '<div style="font-size:13px;color:#dff3fb;">'+
          (prev.actualReps != null ? prev.actualReps + ' reps' : prev.section)+
          ' - <span style="color:'+diffColor+';">'+prev.difficulty.toUpperCase()+'</span>'+
        '</div>'+
      '</div>';
    }
    html += '<div class="panel" style="width:100%;margin-top:16px;">';
    if (cur.type === "reps") {
      var sugVal = sug && sug.suggestedReps ? sug.suggestedReps : '';
      html += '<label class="fieldlabel">ACTUAL REPS DONE <span style="opacity:0.6;">(target: '+cur.repsLabel+(sug && sug.suggestedReps ? ' | suggested: '+sug.suggestedReps : '')+')</span></label>'+
        '<input type="number" id="actualRepsInput" min="0" style="margin-bottom:14px;" placeholder="e.g. 7" value="'+sugVal+'" />';
    } else if (cur.type === "time") {
      var sugDur = sug && sug.suggestedDuration ? sug.suggestedDuration : cur.duration;
      html += '<label class="fieldlabel">ACTUAL HOLD TIME <span style="opacity:0.6;">(target: '+cur.duration+'s'+(sug && sug.suggestedDuration && sug.suggestedDuration!==cur.duration ? ' | suggested: '+sug.suggestedDuration+'s' : '')+')</span></label>'+
        '<input type="number" id="actualDurationInput" min="0" max="'+(cur.duration+10)+'" style="margin-bottom:14px;" placeholder="e.g. '+cur.duration+'" value="'+sugDur+'" />';
    }
    html += '<label class="fieldlabel">HOW DID IT FEEL?</label>';
    html += '<div style="display:flex;gap:10px;">'+
      '<button class="ctrlbtn" onclick="recordSetLog(\'easy\')" style="flex-direction:column;gap:4px;">'+icoSmile("#7fd88a")+'<span>EASY</span></button>'+
      '<button class="ctrlbtn" onclick="recordSetLog(\'hard\')" style="flex-direction:column;gap:4px;">'+icoNeutral("#ffd60a")+'<span>HARD</span></button>'+
      '<button class="ctrlbtn" onclick="recordSetLog(\'failed\')" style="flex-direction:column;gap:4px;">'+icoFrown("#ff7b86")+'<span>FAILED</span></button>'+
    '</div></div>';
  }

  /* Feature 4: Note button during active phases */
  if (state.phase !== "logSet" && state.phase !== "rest") {
    var hasNote = !!state.notes[cur.name];
    html += '<button onclick="openNoteModal(\''+cur.name.replace(/'/g,"\\'")+'\')" style="margin-top:12px;font-size:10px;letter-spacing:1px;color:'+(hasNote?t.accent:TEXT_DIM)+';display:flex;align-items:center;gap:5px;">'+
      (hasNote?icoNote(t.accent):icoNote(TEXT_DIM))+(hasNote?'VIEW NOTES':'ADD NOTE')+'</button>';
  }

  html += '<div style="display:flex;gap:12px;margin-top:16px;width:100%;">';
  if (state.phase === "awaitingFinish") {
    html += '<button class="bigbtn" onclick="finishReps()" style="background:'+t.accent+';color:#02080a;box-shadow:0 0 20px '+t.glow+';padding:16px;">'+icoCheck("#02080a")+' FINISH SET</button>';
  } else if (state.phase === "logSet") {
    /* controls replaced by the log panel above */
  } else {
    html += '<button class="ctrlbtn" onclick="togglePause()">'+(state.paused?icoPlay("#dff3fb"):icoPause("#dff3fb"))+' '+(state.paused?"RESUME":"PAUSE")+'</button>';
    html += '<button class="ctrlbtn" onclick="skipPhase()">'+icoSkip("#dff3fb")+' SKIP</button>';
  }
  html += '</div>';
  html += '<button onclick="exitSession()" style="margin-top:12px;width:100%;padding:12px;border-radius:12px;background:transparent;border:1px solid rgba(255,77,94,0.4);color:#ff7b86;font-size:12px;letter-spacing:1px;">'+
    (percent >= 75 ? "FINISH EARLY (WILL COUNT - "+percent+"%)" : "FINISH EARLY (WON'T COUNT - "+percent+"%)")+
  '</button>';
  html += '</div>';
  return html;
}

function renderComplete() {
  var t = theme();
  var elapsed = state.sessionStartTime ? Math.round((Date.now() - state.sessionStartTime) / 1000) : 0;
  var mins = Math.floor(elapsed / 60);
  var secs = elapsed % 60;
  var timeStr = mins + "m " + secs + "s";

  var log = state.sessionLog || [];
  var totalSets = log.length;
  var easy = 0, hard = 0, failed = 0;
  log.forEach(function(e){
    if (e.difficulty === "easy") easy++;
    else if (e.difficulty === "hard") hard++;
    else failed++;
  });
  var avgDiff = totalSets > 0 ? (easy >= hard && easy >= failed ? "EASY" : failed >= hard ? "FAILED" : "HARD") : "N/A";

  var html = '<div class="wrap" style="margin-top:40px;text-align:center;">';
  html += icoFlame(t.accent);
  html += '<div class="hdr" style="font-size:24px;color:'+t.accent+';margin-top:14px;text-shadow:0 0 14px '+t.glow+';">PROTOCOL COMPLETE</div>';
  html += '<div class="dim" style="font-size:12px;margin-top:6px;">'+state.selectedDay+' session logged.</div>';

  /* Session summary cards */
  html += '<div class="panel" style="margin-top:24px;text-align:left;">';
  html += '<div class="dim" style="font-size:10px;letter-spacing:2px;margin-bottom:12px;">SESSION SUMMARY</div>';

  html += '<div class="statgrid" style="grid-template-columns:1fr 1fr;">';
  html += '<div class="statbox"><div class="statval" style="font-size:20px;">'+timeStr+'</div><div class="statlabel dim">DURATION</div></div>';
  html += '<div class="statbox"><div class="statval" style="font-size:20px;">'+totalSets+'</div><div class="statlabel dim">SETS LOGGED</div></div>';
  html += '<div class="statbox"><div class="statval" style="font-size:20px;color:#7fd88a;">'+easy+'</div><div class="statlabel dim">EASY</div></div>';
  html += '<div class="statbox"><div class="statval" style="font-size:20px;color:#ffd60a;">'+hard+'</div><div class="statlabel dim">HARD</div></div>';
  html += '<div class="statbox"><div class="statval" style="font-size:20px;color:#ff7b86;">'+failed+'</div><div class="statlabel dim">FAILED</div></div>';
  html += '<div class="statbox"><div class="statval" style="font-size:20px;">'+avgDiff+'</div><div class="statlabel dim">AVG DIFFICULTY</div></div>';
  html += '</div>';

  /* PRs achieved this session */
  var sessionPRs = [];
  log.forEach(function(e){
    var pr = state.personalRecords[e.exercise];
    if (pr && pr.date === todayISO) {
      var already = sessionPRs.some(function(p){ return p.exercise === e.exercise; });
      if (!already) sessionPRs.push({ exercise: e.exercise, type: pr.bestReps != null ? "Best reps: " + pr.bestReps : "First log" });
    }
  });
  if (sessionPRs.length > 0) {
    html += '<div class="dim" style="font-size:9px;letter-spacing:1px;margin-top:14px;margin-bottom:8px;">'+icoFlame("#ffd60a",10)+' PERSONAL RECORDS</div>';
    sessionPRs.forEach(function(pr){
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:11px;">'+
        '<span style="color:#ffd60a;">'+pr.exercise+'</span>'+
        '<span style="color:#cde3ec;">'+pr.type+'</span>'+
      '</div>';
    });
  }

  if (log.length > 0) {
    html += '<div class="dim" style="font-size:9px;letter-spacing:1px;margin-top:14px;margin-bottom:8px;">SET BREAKDOWN</div>';
    log.forEach(function(e){
      var diffColor = e.difficulty==="easy"?"#7fd88a":e.difficulty==="hard"?"#ffd60a":"#ff7b86";
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:11px;">'+
        '<span style="color:#cde3ec;">'+e.exercise+' - SET '+e.setIndex+'</span>'+
        '<span style="color:'+diffColor+';">'+(e.actualReps != null ? e.actualReps+' reps - ':e.section+' - ')+e.difficulty.toUpperCase()+'</span>'+
      '</div>';
    });
  }

  html += '</div>';

  html += '<button class="hdr" onclick="returnFromComplete()" style="margin-top:24px;padding:14px 28px;border-radius:12px;background:'+t.accent+';color:#02080a;font-size:13px;">RETURN</button>';
  html += '</div>';
  return html;
}

function renderStats() {
  var t = theme();
  var s = computeStats();
  var html = '<div class="wrap">';
  html += '<div class="row" style="margin-bottom:16px;"><div class="hdr" style="font-size:16px;color:'+t.accent+';letter-spacing:1px;">DIAGNOSTICS</div>'+
    '<button onclick="toggleStats()" style="color:'+TEXT_DIM+';">'+icoX(TEXT_DIM)+'</button></div>';

  /* Summary stat cards */
  html += '<div class="statgrid">';
  html += '<div class="panel statbox"><div style="color:'+t.accent+';margin-bottom:8px;">'+icoChart(t.accent)+'</div><div class="statval">'+s.totalSessions+'</div><div class="statlabel dim">SESSIONS LOGGED</div></div>';
  html += '<div class="panel statbox"><div style="color:'+t.accent+';margin-bottom:8px;">'+icoChart(t.accent)+'</div><div class="statval">'+s.totalBoulder+'</div><div class="statlabel dim">BOULDER LOGS</div></div>';
  html += '<div class="panel statbox"><div style="color:'+t.accent+';margin-bottom:8px;">'+icoChart(t.accent)+'</div><div class="statval">'+s.thisWeekCount+'/6</div><div class="statlabel dim">THIS WEEK</div></div>';
  html += '<div class="panel statbox"><div style="color:'+t.accent+';margin-bottom:8px;">'+icoFlame(t.accent,16)+'</div><div class="statval">'+s.streak+'d</div><div class="statlabel dim">CURRENT STREAK</div></div>';
  html += '</div>';

  /* Last 7 days dots */
  html += '<div class="panel" style="margin-bottom:16px;"><div class="dim" style="font-size:10px;letter-spacing:2px;margin-bottom:8px;">LAST 7 DAYS</div><div style="display:flex;gap:8px;justify-content:space-between;">';
  s.last7.forEach(function(d){
    var dow = new Date(d.iso+"T00:00:00").toLocaleDateString(undefined,{weekday:"short"}).slice(0,2).toUpperCase();
    var dotStyle = d.isRestDay
      ? 'background:transparent;border:2px dashed '+t.accentDim+';'
      : 'background:'+(d.active?t.accent:'rgba(255,255,255,0.06)')+';box-shadow:'+(d.active?'0 0 10px '+t.glow:'none')+';';
    html += '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div class="dot" style="'+dotStyle+'"></div><span class="dim" style="font-size:9px;">'+dow+'</span></div>';
  });
  html += '</div></div>';

  /* Tab navigation */
  var tabs = ["monthly","progression","exercise","measurements","muscles"];
  var tabLabels = { monthly: "MONTHLY", progression: "PROGRESSION", exercise: "EXERCISE LOG", measurements: "BODY", muscles: "MUSCLES" };
  html += '<div class="panel" style="margin-bottom:16px;padding:6px;display:flex;gap:4px;">';
  tabs.forEach(function(tab){
    var active = state.statsTab === tab;
    html += '<button onclick="state.statsTab=\''+tab+'\';render();" style="flex:1;padding:8px 4px;border-radius:8px;font-size:10px;letter-spacing:1px;background:'+(active?t.accent:'transparent')+';color:'+(active?'#02080a':TEXT_DIM)+';border:none;cursor:pointer;">'+tabLabels[tab]+'</button>';
  });
  html += '</div>';

  /* TAB: Monthly heatmap with month navigation */
  if (state.statsTab === "monthly") {
    var now = new Date();
    var viewDate = new Date(now.getFullYear(), now.getMonth() - state.statsMonthOffset, 1);
    var monthLabel = viewDate.toLocaleDateString(undefined, { month: "long", year: "numeric" }).toUpperCase();

    html += '<div class="panel" style="margin-bottom:16px;">';
    html += '<div class="row" style="margin-bottom:10px;">'+
      '<button onclick="state.statsMonthOffset++;render();" style="color:'+TEXT_DIM+';padding:4px 8px;">&#9664;</button>'+
      '<div class="dim" style="font-size:10px;letter-spacing:2px;flex:1;text-align:center;">'+monthLabel+'</div>'+
      '<button onclick="if(state.statsMonthOffset>0){state.statsMonthOffset--;render();}" style="color:'+(state.statsMonthOffset>0?TEXT_DIM:'rgba(255,255,255,0.1)')+';padding:4px 8px;">&#9654;</button>'+
    '</div>';

    /* Build month grid */
    var y = viewDate.getFullYear(), m = viewDate.getMonth();
    var daysInMonth = new Date(y, m+1, 0).getDate();
    var firstDow = new Date(y, m, 1).getDay();
    html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">';
    /* Empty slots for offset */
    for (var pad = 0; pad < firstDow; pad++) html += '<div class="daycell" style="background:transparent;"></div>';
    for (var day = 1; day <= daysInMonth; day++) {
      var iso = y + "-" + String(m+1).padStart(2,"0") + "-" + String(day).padStart(2,"0");
      var dayDate = new Date(iso+"T00:00:00");
      var dow = dayDate.getDay();
      var isRestDay = dow === 0 || dow === 3;
      var isFuture = iso > todayISO;
      var pct = 0;
      if (isFuture) {
        /* future days: show as neutral, not red */
      } else if (!isRestDay) {
        var daySessions = setLogsForDate(iso);
        var dayBoulder = boulderLogsForDate(iso);
        var dayTotal = daySessions.length + dayBoulder.length;
        if (dayTotal > 0) {
          var dayDifficulty = daySessions.reduce(function(sum, e){ return sum + (e.difficulty === "easy" ? 1 : e.difficulty === "hard" ? 0.5 : 0); }, 0);
          pct = Math.min(100, Math.round((dayDifficulty / daySessions.length) * 100)) || (dayTotal > 0 ? 50 : 0);
        }
      }
      var dayStyle = isFuture
        ? 'background:rgba(255,255,255,0.04);color:'+TEXT_DIM+';'
        : isRestDay
        ? 'border:1.5px dashed '+t.accentDim+';color:'+t.accentDim+';'
        : 'background:'+percentToColor(pct)+';box-shadow:0 0 5px rgba(0,0,0,0.4);color:#02080a;';
      var todayMark = iso === todayISO ? 'outline:2px solid '+t.accent+';outline-offset:1px;' : '';
      html += '<div class="daycell" style="'+dayStyle+todayMark+'" title="'+iso+' - '+pct+'%">'+day+'</div>';
    }
    html += '</div>';
    html += '<div class="row" style="font-size:9px;">'+
      '<span class="dim">0%</span>'+
      '<div style="flex:1;height:6px;margin:0 8px;border-radius:3px;background:linear-gradient(90deg,#ff3b30,#ff9500,#ffd60a,#34c759);"></div>'+
      '<span class="dim">100%</span>'+
    '</div></div>';
  }

  /* TAB: Weekly progression (Feature 7) */
  if (state.statsTab === "progression") {
    /* Collect all exercises with history */
    var exercisesWithHistory = [];
    var seenNames = {};
    state.exerciseHistory.forEach(function(r){
      if (!seenNames[r.exercise]) {
        seenNames[r.exercise] = true;
        exercisesWithHistory.push(r.exercise);
      }
    });

    if (exercisesWithHistory.length === 0) {
      html += '<div class="panel" style="text-align:center;color:'+TEXT_DIM+';font-size:13px;padding:30px;">No exercise history yet. Complete a session to see progression.</div>';
    } else {
      /* Show last 8 weeks */
      var weekData = {};
      var now2 = new Date();
      for (var w = 0; w < 8; w++) {
        var weekStart = new Date(now2);
        weekStart.setDate(weekStart.getDate() - weekStart.getDay() - (w * 7));
        var weekEnd = new Date(weekStart);
        weekEnd.setDate(weekEnd.getDate() + 6);
        var ws = localISO(weekStart);
        var we = localISO(weekEnd);
        var wLabel = (weekStart.getMonth()+1) + "/" + weekStart.getDate();
        weekData[w] = { label: wLabel, start: ws, end: we, exercises: {} };
      }

      /* Fill in actual data from exerciseHistory and setLogs */
      exercisesWithHistory.forEach(function(exName){
        for (var w = 0; w < 8; w++) {
          weekData[w].exercises[exName] = 0;
        }
      });
      state.exerciseHistory.forEach(function(r){
        for (var w = 0; w < 8; w++) {
          if (r.date >= weekData[w].start && r.date <= weekData[w].end) {
            weekData[w].exercises[r.exercise] = (weekData[w].exercises[r.exercise] || 0) + r.setsCompleted;
          }
        }
      });

      /* Find max for scaling */
      var maxSets = 1;
      for (var w = 0; w < 8; w++) {
        exercisesWithHistory.forEach(function(ex){
          if (weekData[w].exercises[ex] > maxSets) maxSets = weekData[w].exercises[ex];
        });
      }

      /* Render per-exercise chart */
      exercisesWithHistory.forEach(function(exName){
        html += '<div class="panel" style="margin-bottom:12px;">';
        html += '<div class="dim" style="font-size:10px;letter-spacing:2px;margin-bottom:10px;">'+exName.toUpperCase()+'</div>';
        html += '<div style="display:flex;align-items:flex-end;gap:6px;height:80px;">';
        for (var w = 7; w >= 0; w--) {
          var val = weekData[w].exercises[exName] || 0;
          var h = maxSets > 0 ? Math.round((val / maxSets) * 70) : 0;
          html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;">'+
            '<span style="font-size:9px;color:'+t.accent+';">'+(val > 0 ? val : '')+'</span>'+
            '<div style="width:100%;height:'+Math.max(h,2)+'px;background:'+(val>0?t.accent:'rgba(255,255,255,0.06)')+';border-radius:3px;transition:height 0.3s;"></div>'+
            '<span class="dim" style="font-size:8px;">'+weekData[w].label+'</span>'+
          '</div>';
        }
        html += '</div></div>';
      });
    }
  }

  /* TAB: Exercise Log */
  if (state.statsTab === "exercise") {
    var dayPlan = PLAN[state.selectedDay];
    if (dayPlan.mode === "session") {
      html += '<div class="panel" style="margin-bottom:16px;"><div class="dim" style="font-size:10px;letter-spacing:2px;margin-bottom:8px;">EXERCISE LOG . '+state.selectedDay.toUpperCase()+'</div>';
      dayPlan.main.forEach(function(e, idx){
        var eff = getEffective(state.selectedDay, "MAIN", idx);
        var rec = lastExerciseRecord(eff.name);
        var setLog = lastSetLog(eff.name);
        var extra = "";
        if (setLog) {
          extra = " . " + (setLog.actualReps != null ? setLog.actualReps + " reps " : "") + setLog.difficulty.toUpperCase();
        }
        var hasNote = !!state.notes[eff.name];
        html += '<div class="exline"><span>'+eff.name+(hasNote?' <span class="note-indicator"></span>':'')+'</span><span class="dim" style="white-space:nowrap;">'+(rec ? rec.date+" - "+rec.setsCompleted+"/"+rec.setsTotal+" sets"+extra : "no data yet")+'</span></div>';
      });
      html += '</div>';
    } else {
      html += '<div class="panel" style="text-align:center;color:'+TEXT_DIM+';font-size:13px;padding:30px;">No exercises on rest days.</div>';
    }
  }

  /* TAB: Body Measurements */
  if (state.statsTab === "measurements") {
    var mFields = ["weight","chest","waist","hips","arms","thighs"];
    var mLabels = { weight:"WEIGHT (kg)", chest:"CHEST (cm)", waist:"WAIST (cm)", hips:"HIPS (cm)", arms:"ARMS (cm)", thighs:"THIGHS (cm)" };
    var mColors = { weight:"#00e5ff", chest:"#ff9500", waist:"#ff4d5e", hips:"#b48cff", arms:"#39ff88", thighs:"#ffd60a" };

    html += '<div class="panel" style="margin-bottom:16px;text-align:center;">'+
      '<button onclick="openMeasurementModal()" style="padding:12px 20px;border-radius:10px;background:'+t.accent+';color:#02080a;font-size:12px;letter-spacing:1px;font-weight:bold;">LOG MEASUREMENTS</button>'+
      '</div>';

    if (state.measurements.length === 0) {
      html += '<div class="panel" style="text-align:center;color:'+TEXT_DIM+';font-size:13px;padding:30px;">No measurements logged yet. Tap the button above to start tracking.</div>';
    } else {
      var latest = state.measurements[state.measurements.length - 1];
      html += '<div class="panel" style="margin-bottom:16px;"><div class="dim" style="font-size:10px;letter-spacing:2px;margin-bottom:10px;">LATEST - '+latest.date+'</div>';
      html += '<div class="statgrid" style="grid-template-columns:1fr 1fr 1fr;">';
      mFields.forEach(function(f){
        if (latest[f] != null) {
          html += '<div class="statbox"><div class="statval" style="font-size:16px;color:'+mColors[f]+';">'+latest[f]+'</div><div class="statlabel dim">'+mLabels[f]+'</div></div>';
        }
      });
      html += '</div></div>';

      mFields.forEach(function(f){
        var points = state.measurements.filter(function(m){ return m[f] != null; });
        if (points.length < 2) return;
        var vals = points.map(function(m){ return m[f]; });
        var min = Math.min.apply(null, vals);
        var max = Math.max.apply(null, vals);
        var range = max - min || 1;
        html += '<div class="panel" style="margin-bottom:12px;"><div class="dim" style="font-size:9px;letter-spacing:1px;margin-bottom:8px;">'+mLabels[f]+' ('+points.length+' logs)</div>';
        html += '<div style="display:flex;align-items:flex-end;gap:2px;height:60px;">';
        points.forEach(function(p){
          var h = Math.round(((p[f] - min) / range) * 50) + 8;
          html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;">'+
            '<span style="font-size:7px;color:'+mColors[f]+';margin-bottom:2px;">'+p[f]+'</span>'+
            '<div style="width:100%;max-width:40px;height:'+h+'px;background:'+mColors[f]+';border-radius:2px;opacity:0.8;"></div>'+
            '<span class="dim" style="font-size:7px;margin-top:2px;">'+p.date.slice(5)+'</span>'+
            '</div>';
        });
        html += '</div></div>';
      });

      html += '<div class="panel" style="margin-bottom:16px;"><div class="dim" style="font-size:10px;letter-spacing:2px;margin-bottom:8px;">HISTORY</div>';
      state.measurements.slice().reverse().forEach(function(m){
        var summary = mFields.filter(function(f){ return m[f] != null; }).map(function(f){ return m[f] + " " + f.charAt(0).toUpperCase() + f.slice(1); }).join(" - ");
        html += '<div class="exline"><span style="color:'+t.accent+';">'+m.date+'</span><span class="dim" style="white-space:nowrap;font-size:10px;">'+summary+'</span></div>';
      });
      html += '</div>';
    }
  }

  /* TAB: Muscle Heat Map */
  if (state.statsTab === "muscles") {
    /* Calculate weekly volume per muscle group */
    var now = new Date();
    var weekStart = new Date(now);
    weekStart.setDate(weekStart.getDate() - weekStart.getDay());
    var weekStartISO = localISO(weekStart);
    var weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);
    var weekEndISO = localISO(weekEnd);

    var muscleVolume = {};
    MUSCLE_GROUPS.forEach(function(mg){ muscleVolume[mg] = 0; });

    /* Count sets from this week's session logs */
    state.setLogs.forEach(function(sl){
      if (sl.date >= weekStartISO && sl.date <= weekEndISO) {
        var tags = MUSCLE_TAGS[sl.exercise];
        if (tags) {
          Object.keys(tags).forEach(function(mg){
            muscleVolume[mg] = (muscleVolume[mg] || 0) + tags[mg];
          });
        }
      }
    });

    /* Also count boulder sessions */
    state.history.forEach(function(h){
      if (h.type === "boulder" && h.date >= weekStartISO && h.date <= weekEndISO) {
        muscleVolume.forearms = (muscleVolume.forearms || 0) + 3;
        muscleVolume.lats = (muscleVolume.lats || 0) + 2;
        muscleVolume.biceps = (muscleVolume.biceps || 0) + 1;
        muscleVolume.core = (muscleVolume.core || 0) + 1;
      }
    });

    var maxVol = Math.max.apply(null, MUSCLE_GROUPS.map(function(mg){ return muscleVolume[mg] || 0; }));
    if (maxVol === 0) maxVol = 1;

    html += '<div class="panel" style="margin-bottom:16px;">';
    html += '<div class="dim" style="font-size:10px;letter-spacing:2px;margin-bottom:4px;">WEEKLY MUSCLE VOLUME</div>';
    html += '<div class="dim" style="font-size:9px;margin-bottom:12px;">'+weekStartISO+' to '+weekEndISO+'</div>';

    /* Body diagram using CSS grid */
    html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:16px;">';
    /* Simplified body layout: top row = shoulders, lats, rear_delts; mid = chest, core, traps; bottom = biceps, quads, triceps; lower = glutes, hamstrings, forearms */
    var bodyLayout = [
      ["shoulders", "lats", "rear_delts"],
      ["chest", "core", "traps"],
      ["biceps", "quads", "triceps"],
      ["glutes", "hamstrings", "forearms"]
    ];
    bodyLayout.forEach(function(row){
      row.forEach(function(mg){
        var vol = muscleVolume[mg] || 0;
        var intensity = vol / maxVol;
        var baseColor = MUSCLE_COLORS[mg] || "#fff";
        var bgColor = intensity > 0 ? baseColor : "rgba(255,255,255,0.04)";
        var opacity = intensity > 0 ? (0.2 + intensity * 0.6) : 1;
        html += '<div style="padding:10px 6px;border-radius:8px;background:'+bgColor+';opacity:'+opacity+';text-align:center;border:1px solid '+(intensity > 0 ? baseColor : "rgba(255,255,255,0.06)")+';">';
        html += '<div style="font-size:9px;letter-spacing:1px;color:'+(intensity > 0 ? "#02080a" : TEXT_DIM)+';font-weight:bold;">'+MUSCLE_LABELS[mg]+'</div>';
        html += '<div style="font-size:14px;font-weight:900;color:'+(intensity > 0 ? "#02080a" : "#dff3fb")+';margin-top:2px;">'+vol+'</div>';
        html += '</div>';
      });
    });
    html += '</div>';

    /* Bar chart per muscle group */
    html += '<div style="display:flex;flex-direction:column;gap:4px;">';
    MUSCLE_GROUPS.forEach(function(mg){
      var vol = muscleVolume[mg] || 0;
      var pct = Math.round((vol / maxVol) * 100);
      html += '<div style="display:flex;align-items:center;gap:8px;">';
      html += '<span style="font-size:9px;color:'+MUSCLE_COLORS[mg]+';width:70px;text-align:right;letter-spacing:0.5px;">'+MUSCLE_LABELS[mg]+'</span>';
      html += '<div style="flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden;">';
      html += '<div style="width:'+pct+'%;height:100%;background:'+MUSCLE_COLORS[mg]+';border-radius:4px;"></div>';
      html += '</div>';
      html += '<span style="font-size:9px;color:'+TEXT_DIM+';width:20px;">'+vol+'</span>';
      html += '</div>';
    });
    html += '</div>';
    html += '</div>';

    /* Exercise -> Muscle mapping reference */
    html += '<div class="panel" style="margin-bottom:16px;"><div class="dim" style="font-size:10px;letter-spacing:2px;margin-bottom:8px;">EXERCISE MAPPING</div>';
    Object.keys(MUSCLE_TAGS).forEach(function(exName){
      var tags = MUSCLE_TAGS[exName];
      var tagList = Object.keys(tags).map(function(mg){ return '<span style="color:'+MUSCLE_COLORS[mg]+';">'+MUSCLE_LABELS[mg]+' ('+tags[mg]+')</span>'; }).join(", ");
      html += '<div class="exline"><span style="font-size:10px;">'+exName+'</span></div>';
      html += '<div style="font-size:9px;color:'+TEXT_DIM+';padding:0 0 6px;border-bottom:1px solid rgba(255,255,255,0.04);">'+tagList+'</div>';
    });
    html += '</div>';
  }

  /* PR Leaderboard */
  var prKeys = Object.keys(state.personalRecords);
  if (prKeys.length > 0) {
    html += '<div class="panel" style="margin-bottom:16px;"><div class="dim" style="font-size:10px;letter-spacing:2px;margin-bottom:10px;">'+icoFlame("#ffd60a",10)+' PERSONAL RECORDS</div>';
    prKeys.sort(function(a,b){ return (state.personalRecords[b].date||"").localeCompare(state.personalRecords[a].date||""); });
    prKeys.forEach(function(name){
      var pr = state.personalRecords[name];
      var prType = pr.bestReps != null ? pr.bestReps + " reps" : "logged";
      html += '<div class="exline"><span style="color:#ffd60a;">'+name+'</span><span class="dim" style="white-space:nowrap;">'+prType+' - '+pr.date+'</span></div>';
    });
    html += '</div>';
  }

  html += '<div style="display:flex;gap:10px;">'+
    '<button class="smallbtn" style="flex:1;" onclick="exportData()">'+icoDownload(TEXT_DIM)+' EXPORT DATA</button>'+
    '<button class="smallbtn" style="flex:1;" onclick="triggerImport()">'+icoUpload(TEXT_DIM)+' IMPORT DATA</button>'+
  '</div>';

  html += '</div>';
  return html;
}

function render() {
  var html = renderHeader();
  if (state.view === "overview") html += renderOverview();
  else if (state.view === "active") html += renderActive();
  else if (state.view === "complete") html += renderComplete();
  else if (state.view === "stats") html += renderStats();
  html += renderNoteModal();
  html += renderMeasurementModal();
  document.getElementById("app").innerHTML = html;
  saveSessionState();
}

/* ============================================================
   EVENT HANDLERS (global, called from inline onclick)
   ============================================================ */
function toggleDayMenu(){ state.dayPickerOpen = !state.dayPickerOpen; state.themePickerOpen=false; render(); }
function selectDay(d){ state.selectedDay = d; state.dayPickerOpen = false; render(); }
function toggleThemeMenu(e){ e.stopPropagation(); state.themePickerOpen = !state.themePickerOpen; state.dayPickerOpen=false; render(); }
function selectTheme(k){ state.themeKey = k; Storage.set("theme-key", k); render(); }
function selectAlertMode(m){ state.alertMode = m; Storage.set("alert-mode", m); render(); }
function toggleStats(){ state.view = state.view === "stats" ? "overview" : "stats"; render(); }

document.addEventListener("click", function(e){
  if (!e.target.closest(".theme-menu") && !e.target.closest('[onclick*="toggleThemeMenu"]')) state.themePickerOpen = false;
});

if (state.view === "active") runTimer();
</script>
</body>
</html>
